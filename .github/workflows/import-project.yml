name: Import Android project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e
          archive="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$archive"
          mkdir -p /tmp/nyu-project
          unzip -q "$archive" -d /tmp/nyu-project
          project_dir="$(find /tmp/nyu-project -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$project_dir"
          cp -a "$project_dir"/. .
          rm -f "$archive"

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi
          git commit -m "Import Nyu Samma Android project"
          git push
